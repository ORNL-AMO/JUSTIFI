<div class="d-flex justify-content-end">
    <div class="d-flex">
        <button class="btn btn-outline-success me-1 btn-sm" (click)="goToVisit()">
            <fa-icon [icon]="faWandMagicSparkles"></fa-icon>
            <span class="d-none">
                Open {{assessment.name}} In Wizard
            </span>
        </button>
        <button *ngIf="!inAssessmentDashboard" class="btn btn-dark btn-sm me-1" (click)="goToAssessmentDashboard()">
            <fa-icon [icon]="faExpand"></fa-icon>
            <span class="d-none">
                {{assessment.name}}
                Dashboard
            </span>
        </button>
        <button class="btn btn-danger btn-sm" (click)="openDeleteAssessmentModal()">
            <fa-icon [icon]="faTrash"></fa-icon>
            <span class="d-none">
                Delete
                {{assessment.name}}
            </span>
        </button>
    </div>
</div>
<hr>

<table class="table table-bordered">
    <tbody>
        <tr>
            <th>
                Assessment Type
            </th>
            <td>
                {{assessment.assessmentType}}
            </td>
        </tr>
        <tr>
            <th>
                Visit Date
            </th>
            <td>
                {{assessment.visitDate | date}}
            </td>
        </tr>
        <tr>
            <th>
                Utility Usage
            </th>
            <td>
                <ng-container *ngFor="let utilityType of assessment.utilityEnergyUses">
                    <ng-container *ngIf="utilityType.include">
                        {{utilityType.utilityType}}: {{utilityType.energyUse | number}} <span
                            [innerHTML]="utilityType.energyUnit | unitsDisplay"></span><br>
                    </ng-container>
                </ng-container>
            </td>
        </tr>
        <tr>
            <th>
                Annual Costs
            </th>
            <td>
                <ng-template [ngIf]="assessment.cost" [ngIfElse]="noCostMdash">
                    {{assessment.cost | currency}}
                </ng-template>
                <ng-template #noCostMdash>
                    &mdash;
                </ng-template>
            </td>
        </tr>
        <tr>
            <th>
                Energy Opportunities
            </th>
            <td>
                <ng-template [ngIf]="energyOpportunities.length > 0" [ngIfElse]="noOppsMdash">
                    <ng-container *ngFor="let opportunity of energyOpportunities">
                        {{opportunity.name}}<br>
                    </ng-container>
                </ng-template>
                <ng-template #noOppsMdash>
                    &mdash;
                </ng-template>
            </td>
        </tr>
    </tbody>
</table>
