<div class="d-flex">
    <div class="d-flex nav-flex pe-3">
        <nav class="nav navbar nav-tabs flex-column">

            <div class="nav-item mb-2">
                <a class="nav-link" [routerLink]="'/portfolio/company/'+company.guid + '/performance-indicators'"
                    [routerLinkActive]="'active'" [routerLinkActiveOptions]="{exact: true}">
                    <div class="d-flex w-100 justify-content-between">
                        <div class="d-block">
                            Select Key Performance Indicators
                        </div>
                        <div>
                            <fa-icon class="chevron float-right" [icon]="faChevronRight"></fa-icon>
                        </div>
                    </div>
                </a>
            </div>
            <div class="nav-item" *ngFor="let kpi of keyPerformanceIndicators">
                <a class="nav-link"
                    [routerLink]="'/portfolio/company/'+company.guid + '/performance-indicators/details/'+kpi.guid"
                    [routerLinkActive]="'active'">
                    <div class="d-flex w-100 justify-content-between">
                        <div class="d-block">
                            <span [innerHTML]="kpi.htmlLabel"></span>
                        </div>
                        <div>
                            <fa-icon class="chevron float-right" [icon]="faChevronRight"></fa-icon>
                        </div>
                    </div>
                </a>
            </div>
        </nav>
    </div>
    <div class="card portfolio w-100">
        <div class="card-body">
            <router-outlet></router-outlet>
        </div>
    </div>
</div>
