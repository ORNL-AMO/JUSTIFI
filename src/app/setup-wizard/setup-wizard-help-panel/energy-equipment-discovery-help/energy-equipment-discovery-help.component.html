<!--TAKE STOCK-->
<ng-template [ngIf]="isTakeStock">
    <label>
        <fa-icon [icon]="faClipboardQuestion"></fa-icon>
        Take Stock
    </label>
    <p class="fw-light small" [innerHTML]="EnergyEquipmentTakeStockHelp.sectionHelp">
    </p>
    <hr>
    <ng-template [ngIf]="focusedHelp == 'howSupportPlant'">
        <label>How does this system support the plant?</label>
        <p class="fw-light small" [innerHTML]="EnergyEquipmentTakeStockHelp.howSupportPlantQs">
        </p>
        <hr>
    </ng-template>
    <ng-template [ngIf]="focusedHelp == 'adverseEffects'">
        <label>How are other areas adversely affected by energy inefficiencies in the system?</label>
        <p class="fw-light small" [innerHTML]="EnergyEquipmentTakeStockHelp.adverseEffects">
        </p>
        <hr>
    </ng-template>
    <ng-template [ngIf]="focusedHelp == 'equipmentFinancialStatus'">
        <label>Describe the financial status of the equipment</label>
        <p class="fw-light small mb-2" [innerHTML]="EnergyEquipmentTakeStockHelp.equipmentFinancialStatus">
        </p>
        <p class="fw-light small" [innerHTML]="EnergyEquipmentTakeStockHelp.equipmentFinancialStatusQs">
        </p>
        <hr>
    </ng-template>
</ng-template>
<!--OPERATIONS-->
<ng-template [ngIf]="isOperations">
    <label>
        <fa-icon [icon]="faClipboardQuestion"></fa-icon>
        Operations
    </label>
    <p class="fw-light small" [innerHTML]="EnergyEquipmentOperationsHelp.sectionHelp">
    </p>
    <hr>
    <ng-template [ngIf]="focusedHelp == 'describeOutputOfSystem'">
        <label>Describe the output of the system and how it aligns with plant needs</label>
        <p class="fw-light small mb-2" [innerHTML]="EnergyEquipmentOperationsHelp.describeOutputOfSystem">
        </p>
        <p class="fw-light small" [innerHTML]="EnergyEquipmentOperationsHelp.describeOutputOfSystemQs">
        </p>
        <hr>
    </ng-template>
    <ng-template [ngIf]="focusedHelp == 'describeServicingNeeds'">
        <label>Describe the maintenance and servicing needs of this system</label>
        <p class="fw-light small mb-2" [innerHTML]="EnergyEquipmentOperationsHelp.describeServicingNeeds">
        </p>
        <p class="fw-light small" [innerHTML]="EnergyEquipmentOperationsHelp.describeServicingNeedsQs">
        </p>
        <hr>
    </ng-template>
    <ng-template [ngIf]="focusedHelp == 'describeLaborRequirements'">
        <label>Describe the labor requirements of this system.</label>
        <p class="fw-light small mb-2" [innerHTML]="EnergyEquipmentOperationsHelp.describeLaborRequirements">
        </p>
        <p class="fw-light small" [innerHTML]="EnergyEquipmentOperationsHelp.describeLaborRequirementsQs">
        </p>
        <hr>
    </ng-template>
    <ng-template [ngIf]="focusedHelp == 'describeSystemMaterials'">
        <label>Describe the materials that are required by this system (raw materials, intermediate goods, treatment
            chemicals)?</label>
        <p class="fw-light small mb-2" [innerHTML]="EnergyEquipmentOperationsHelp.describeSystemMaterials">
        </p>
        <p class="fw-light small" [innerHTML]="EnergyEquipmentOperationsHelp.describeSystemMaterialsQs">
        </p>
        <hr>
    </ng-template>
</ng-template>
<!--SUSTAINABILITY-->
<ng-template [ngIf]="isSustainablity">
    <label>
        <fa-icon [icon]="faClipboardQuestion"></fa-icon>
        Operations
    </label>
    <p class="fw-light small" [innerHTML]="EnergyEquipmentSustainabilityHelp.sectionHelp">
    </p>
    <hr>


    <ng-template [ngIf]="focusedHelp == 'describeWasteStreams'">
        <label>Describe the waste streams that result from this system</label>
        <p class="fw-light small mb-2" [innerHTML]="EnergyEquipmentSustainabilityHelp.describeWasteStreams">
        </p>
        <p class="fw-light small" [innerHTML]="EnergyEquipmentSustainabilityHelp.describeWasteStreamsQs">
        </p>
        <hr>
    </ng-template>
    <ng-template [ngIf]="focusedHelp == 'describeWaterInputDischarge'">
        <label>Describe water input or discharge streams that result from this system</label>
        <p class="fw-light small mb-2" [innerHTML]="EnergyEquipmentSustainabilityHelp.describeWaterInputDischarge">
        </p>
        <p class="fw-light small" [innerHTML]="EnergyEquipmentSustainabilityHelp.describeWaterInputDischargeQs">
        </p>
        <hr>
    </ng-template>

    <ng-template [ngIf]="focusedHelp == 'describeRefrigerantProcessDustEmissions'">
        <label>Describe any refrigerant, process, or dust emissions that may come from this system</label>
        <p class="fw-light small mb-2"
            [innerHTML]="EnergyEquipmentSustainabilityHelp.describeRefrigerantProcessDustEmissions">
        </p>
        <p class="fw-light small"
            [innerHTML]="EnergyEquipmentSustainabilityHelp.describeRefrigerantProcessDustEmissionsQs">
        </p>
        <hr>
    </ng-template>
    <ng-template [ngIf]="focusedHelp == 'describeRegulations'">
        <label>Describe any environmental regulations or considerations impacting this system</label>
        <p class="fw-light small mb-2" [innerHTML]="EnergyEquipmentSustainabilityHelp.describeRegulations">
        </p>
        <p class="fw-light small" [innerHTML]="EnergyEquipmentSustainabilityHelp.describeRegulationsQs">
        </p>
        <hr>
    </ng-template>
</ng-template>

<!--EMPLOYEE ENGAGEMENT-->
<ng-template [ngIf]="isEmployeeEngagement">

        <fa-icon [icon]="faClipboardQuestion"></fa-icon>

    </label>
    <p class="fw-light small" [innerHTML]="EnergyEquipmentEmployeeEngagementHelp.sectionHelp">
    </p>
    <hr>
    
    <ng-template [ngIf]="focusedHelp == 'describeSafetyConcerns'">
        <label>Describe any safety concerns related to this system</label>
        <p class="fw-light small mb-2" [innerHTML]="EnergyEquipmentEmployeeEngagementHelp.describeSafetyConcerns">

        <p class="fw-light small" [innerHTML]="EnergyEquipmentEmployeeEngagementHelp.describeSafetyConcerns">
        </p>
        <hr>
    </ng-template>

    <ng-template [ngIf]="focusedHelp == 'describeWorkplaceEnvironment'">

<p class="fw-light help-disclaimer">
    <fa-icon [icon]="faExclamationCircle"></fa-icon>
    Help panel content is dynamic. Click on input fields to view field-by-field help.
</p>
