<div [ngClass]="{'setup-wizard-content': !print, 'report print': print}">
  <div [ngClass]="{'row g-0 justify-content-center h-100 w-100 overflow-scroll': !print}">
    <div [ngClass]="{'col-11 col-md-10 pt-4 pb-4': !print}">
      <div [ngClass]="{'form-paper shadow': !print}">
        <h5>
          <fa-icon [icon]="faCircleCheck"></fa-icon> Review Pre-Visit
        </h5>
        <hr>
          @if (company) {
            <app-company-details-summary></app-company-details-summary>
            <hr>
              <app-team-details-summary></app-team-details-summary>
              <hr class="solid-hr">
              <app-facility-details-summary></app-facility-details-summary>
              <hr>
                <app-company-kpis-summary></app-company-kpis-summary>
                <hr>
                  <app-system-inventory-summary></app-system-inventory-summary>
                  <hr>
                    <app-process-equipment-summary></app-process-equipment-summary>
                    <hr class="solid-hr">
                    <app-pre-assessment-summary></app-pre-assessment-summary>
                  }
                </div>
              </div>
            </div>
          </div>
          @if (!print) {
            <nav class="setup-wizard-footer navbar shadow">
              <div class="container-fluid justify-content-between">
                <button class="btn nav-btn btn-sm" (click)="goBack()">
                  <fa-icon [icon]="faChevronLeft"></fa-icon>
                  <span class="d-none d-md-inline">
                    Go Back
                  </span>
                </button>
                <button class="btn btn-success btn-sm" (click)="togglePrint()">
                  <fa-icon [icon]="faFilePdf"></fa-icon>
                  <span class="d-none d-md-inline">
                    Generate PDF
                  </span>
                </button>
                <button class="btn nav-btn btn-sm" (click)="continue()">
                  <span class="d-none d-md-inline">
                    Data Collection
                  </span>
                  <fa-icon [icon]="faChevronRight"></fa-icon>
                </button>
              </div>
            </nav>
          }
