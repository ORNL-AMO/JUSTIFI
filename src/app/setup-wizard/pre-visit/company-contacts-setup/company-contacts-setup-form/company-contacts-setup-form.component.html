<h5>
    <fa-icon [icon]="faAddressBook" class="me-2"></fa-icon>Stakeholder Contacts
</h5>
<hr class="my-1">
<div class="d-flex w-100 justify-content-end pb-2">
    <div class="p-0">
        <button class="btn btn-outline-success btn-sm" (click)="addContact()">
            <fa-icon [icon]="faPlus"></fa-icon>
            Add Stakeholder
        </button>
    </div>
</div>
<ng-template [ngIf]="companyContactGuids.length > 0" [ngIfElse]="noContactsBlock">
    <div class="accordion" id="contactAccordion">
        <div class="accordion-item"
            *ngFor="let contactGuid of companyContactGuids; let index = index; let last = last;">

            <h2 class="accordion-header">
                <button class="accordion-button" type="button" data-bs-toggle="collapse"
                    [attr.data-bs-target]="'#'+contactGuid" aria-expanded="true" [attr.aria-controls]="contactGuid"
                    [ngClass]="{'collapsed': accordionGuid != contactGuid}" (click)="toggleBS(contactGuid)">
                    <!--
                    TODO: add back in messaging around validation
                    Updated when using shared form in dashboards
                    -->
                    <fa-icon [icon]="faCircleExclamation" class="pe-1 fa-error"
                        *ngIf="contactGuid | contactInvalid: allContacts"></fa-icon>
                    <fa-icon [icon]="faUser" class="pe-1"></fa-icon>
                    {{contactGuid | contactName: allContacts}}
                </button>
            </h2>
            <div [id]="'#'+contactGuid" class="accordion-collapse collapse" data-bs-parent="#contactAccordion">
                <div class="accordion-body">
                    <app-company-contacts-form [contactGuid]="contactGuid"
                        (emitInitialized)="childFormInitialized(contactGuid, last)"></app-company-contacts-form>
                </div>
            </div>
        </div>
    </div>
</ng-template>
<ng-template #noContactsBlock>
    <div class="alert alert-warning">
        No stakeholder contacts added for this company. Click "<fa-icon [icon]="faPlus"></fa-icon> Add
        Stakeholder"
        to add a contact to this company.
    </div>
</ng-template>
