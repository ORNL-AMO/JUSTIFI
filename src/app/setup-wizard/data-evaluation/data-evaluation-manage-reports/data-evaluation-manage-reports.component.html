@let onSiteReports = (reports | onSiteReportsList: onSiteVisit.guid);
<div class="setup-wizard-content">
    <div class="row g-0 justify-content-center h-100 w-100 overflow-scroll">
        <div class="col-10 pt-4 pb-4">
            <div class="form-paper shadow">
                <h5>
                    <fa-icon [icon]="faList"></fa-icon> Manage Custom Reports
                </h5>
                <hr>
                <div class="d-flex w-100 justify-content-end pb-2">
                    <div class="p-0">
                        <button class="btn btn-outline-success btn-sm" (click)="addReport()">
                            <fa-icon [icon]="faPlus"></fa-icon>
                            Add Report
                        </button>
                    </div>
                </div>
                <ng-template [ngIf]="onSiteReports.length != 0" [ngIfElse]="noReportsBlock">
                    <div class="list-group" *ngFor="let report of onSiteReports;">
                        <div class="list-group-item">
                            <div class="d-flex w-100 justify-content-between">
                                <div class="p-0">
                                    <fa-icon [icon]="faFilePen" class="me-1"></fa-icon>
                                    <a class="click-link" (click)="goToReport(report.guid)">{{report.name}}
                                    </a>
                                </div>
                                <div class="p-0">
                                    <button class="btn btn-sm btn-danger" (click)="openDeleteModal(report)">
                                        <fa-icon [icon]="faTrash"></fa-icon>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>

                </ng-template>
                <ng-template #noReportsBlock>
                    <div class="alert alert-info text-center">
                        No custom reports added. Click "Add Report" to add a custom report.
                    </div>
                </ng-template>
            </div>
        </div>
    </div>
</div>


<nav class="setup-wizard-footer navbar shadow">
    <div class="container-fluid justify-content-between">
        <button class="btn nav-btn btn-sm" (click)="goBack()">
            <fa-icon [icon]="faChevronLeft"></fa-icon>
            Stakeholder Report
        </button>

        <ng-template [ngIf]="onSiteReports.length != 0" [ngIfElse]="noReportsFooterBlock">
            <button class="btn nav-btn btn-sm" (click)="goToReport(onSiteReports[0].guid)">
                Report
                <fa-icon [icon]="faChevronRight"></fa-icon>
            </button>
        </ng-template>
        <ng-template #noReportsFooterBlock>
            <button class="btn nav-btn btn-sm" (click)="goToPortfolio()">
                <fa-icon [icon]="faFolderOpen"></fa-icon>
                Go To Portfolio
            </button>
        </ng-template>
    </div>
</nav>


<div [ngClass]="{'window-overlay': displayDeleteModal}"></div>
<div class="popup" [ngClass]="{'open': displayDeleteModal }">
    <div class="popup-header">Delete Report
        <button type="button" class="btn-close float-end" aria-label="Close" (click)="closeDeleteModal()"></button>
    </div>
    <div class="popup-body">
        <div class="alert alert-danger">
            Are you sure you want to delete this report? This cannot be undone.
        </div>
        <hr>
    </div>
    <div class="popup-footer d-flex justify-content-end">
        <button class="btn btn-secondary me-2 btn-sm" (click)="closeDeleteModal()">Cancel</button>
        <button class="btn btn-danger btn-sm" (click)="deleteReport()"><fa-icon [icon]="faTrash"></fa-icon> Delete
            Report</button>
    </div>
</div>
