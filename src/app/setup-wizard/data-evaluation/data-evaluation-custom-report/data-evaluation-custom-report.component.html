<div class="setup-wizard-content" *ngIf="report">
    <div class="row g-0 justify-content-center h-100 w-100 overflow-scroll">
        <div class="col-10 pt-4 pb-4">
            <div class="form-paper shadow">
                <div class="d-flex w-100 justify-content-between">
                    <div>
                        <h5>
                            <fa-icon [icon]="faFilePen"></fa-icon> {{report.name}}
                        </h5>
                    </div>
                </div>
                <hr class="my-1">
                <nav class="navbar">
                    <ul class="nav nav-tabs">
                        <li class="nav-item">
                            <a class="nav-link" [routerLink]="'options'" [routerLinkActive]="['active']">Options</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" [routerLink]="'results'" [routerLinkActive]="['active']">Report</a>
                        </li>
                    </ul>
                </nav>
                <div class="pt-2">
                    <router-outlet></router-outlet>
                </div>
            </div>
        </div>
    </div>
</div>
<nav class="setup-wizard-footer navbar shadow">
    <div class="container-fluid justify-content-between">
        <div class="col-3">
            <button class="btn nav-btn btn-sm" (click)="goBack()">
                <fa-icon [icon]="faChevronLeft"></fa-icon>
            </button>
        </div>
        <button class="btn btn-success btn-sm" (click)="togglePrint()">
            <fa-icon [icon]="faFilePdf"></fa-icon>
            Generate PDF
        </button>
        <div class="col-3">
            <div class="d-flex  justify-content-end">
                <button class="btn nav-btn btn-sm" (click)="goToNext()">
                    <fa-icon [icon]="faChevronRight"></fa-icon>
                </button>
            </div>
        </div>
    </div>
</nav>
