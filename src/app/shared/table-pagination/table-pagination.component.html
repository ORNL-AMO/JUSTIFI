@if (numberOfPages > 1) {
  <div class="pagination-shell">
    <nav aria-label="Table pagination">
      <ul class="pagination mb-0">
        <li class="page-item" [class.disabled]="pageNumber === 1">
          <button type="button" class="page-link" aria-label="Previous page"
            [disabled]="pageNumber === 1" (click)="setPageNumber(pageNumber - 1)">
            <span aria-hidden="true">&laquo;</span>
          </button>
        </li>
        @for (pageNumberOption of pageNumberOptions; track $index) {
          @if (pageNumberOption === 'ellipsis') {
            <li class="page-item disabled" aria-hidden="true">
              <span class="page-link pagination-ellipsis">&hellip;</span>
            </li>
          } @else {
            <li class="page-item" [class.active]="pageNumber === pageNumberOption">
              <button type="button" class="page-link"
                [attr.aria-current]="pageNumber === pageNumberOption ? 'page' : null"
                [attr.aria-label]="'Page ' + pageNumberOption"
                (click)="setPageNumber(pageNumberOption)">
                {{pageNumberOption}}
              </button>
            </li>
          }
        }
        <li class="page-item" [class.disabled]="pageNumber === numberOfPages">
          <button type="button" class="page-link" aria-label="Next page"
            [disabled]="pageNumber === numberOfPages" (click)="setPageNumber(pageNumber + 1)">
            <span aria-hidden="true">&raquo;</span>
          </button>
        </li>
      </ul>
    </nav>
  </div>
}
