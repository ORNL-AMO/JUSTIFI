@let linkedContacts = (contextGuid | associatedContacts:contactContext: contacts);
<button class="btn btn-sm btn-outline-contact" (click)="openModal(undefined)"
    [ngClass]="{'me-1': linkedContacts.length > 0}">
    <fa-icon [icon]="faLink"></fa-icon>
    Stakeholders
</button>
<button class="btn btn-sm btn-outline-contact me-1" *ngFor="let contact of linkedContacts" (click)="openModal(contact)">
    <fa-icon [icon]="faUser"></fa-icon>
    {{contact | contactNameDisplay}}
</button>

<app-associated-contacts-modal *ngIf="showModal" [companyGuid]="companyGuid" [contactContext]="contactContext"
    [contextGuid]="contextGuid" [selectedContact]="selectedContact"
    (emitCancelContact)="closeModal()"></app-associated-contacts-modal>
