<div [ngClass]="{'window-overlay': displayModal}"></div>
<div class="popup" [ngClass]="{'open': displayModal }">
    <div class="popup-header"><fa-icon [icon]="faLink"></fa-icon> Select Linked Stakeholders
        <button type="button" class="btn-close float-end" aria-label="Close" (click)="closeModal()"></button>
    </div>
    <div class="popup-body">
        <ng-template [ngIf]="!showAddContactForm" [ngIfElse]="addContactForm">
            <ng-template [ngIf]="!selectedContact" [ngIfElse]="contactCard">
                <ng-template [ngIf]="contacts.length != 0" [ngIfElse]="noContactsBlock">
                    <div class="list-group">
                        <div class="list-group-item list-group-item-action"
                            *ngFor="let contact of contacts; let index = index;" (click)="toggleContactActive(index)">
                            <div class="d-flex justify-content-between w-100">
                                <div class="p-0">
                                    <ng-template [ngIf]="(contextGuid | includesContact:contactContext: contact)"
                                        [ngIfElse]="notSelectedBlock">
                                        <fa-icon class="success" [icon]="faCircleCheck"></fa-icon>
                                    </ng-template>
                                    <ng-template #notSelectedBlock>
                                        <fa-icon [icon]="faCircle"></fa-icon>
                                    </ng-template>
                                    {{contact | contactNameDisplay}}
                                </div>
                                <button class="btn btn-sm btn-primary btn-sm" (click)="viewContact(contact)">
                                    View
                                </button>
                            </div>
                        </div>
                    </div>
                </ng-template>
                <ng-template #noContactsBlock>
                    <div class="alert alert-warning">
                        No Stakeholders Found.
                    </div>
                </ng-template>
            </ng-template>
        </ng-template>
        <ng-template #contactCard>
            <div class="mb-3">
                <a class="click-link" (click)="viewContact(undefined)">
                    <fa-icon [icon]="faChevronLeft"></fa-icon> View All Stakeholders
                </a>
            </div>

            <ng-template [ngIf]="(contextGuid | includesContact:contactContext: selectedContact)">
                <fa-icon class="success me-1" [icon]="faCircleCheck"></fa-icon>
                <span class="linked-contact-label">Linked Stakeholder</span>
            </ng-template>

            <div class="mt-2">
                <app-company-contacts-form [contactGuid]="selectedContact.guid" [isModal]="true"
                    [isViewForm]="true"></app-company-contacts-form>
            </div>
        </ng-template>
        <ng-template #addContactForm>
            <div class="mb-3">
                <a class="click-link" (click)="viewContact(undefined)">
                    <fa-icon [icon]="faChevronLeft"></fa-icon> View All Stakeholders
                </a>
            </div>
            <app-company-contacts-form (formChanged)="onContactFormChanged($event)"
                [contactGuid]="newContact.guid" [isModal]="true"></app-company-contacts-form>
            <div *ngIf="showInvalidFormAlert" class="alert alert-danger mt-2">
                Please fill the required fields before proceeding.
            </div>
        </ng-template>
        <hr class="my-1">
    </div>
    <div class="popup-footer d-flex justify-content-end">
        <button class="btn btn-secondary me-2 btn-sm" (click)="closeModal()">Cancel</button>
        <button class="btn btn-outline-success me-2 btn-sm" *ngIf="!showAddContactForm" (click)="addContact()">
            <fa-icon [icon]="faPlus"></fa-icon>
            Add Stakeholder
        </button>
        <button class="btn btn-outline-contact btn-sm" (click)="saveChanges()"><fa-icon [icon]="faSave"></fa-icon> Set
            Linked
            Stakeholders</button>
    </div>
</div>
