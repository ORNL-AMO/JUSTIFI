<form>
    <div class="row">
        <label class="col-sm-5 col-form-label" for="reportName">Report Name <span
                class="required-asterisk">*</span></label>
        <div class="col-sm-7">
            <input name="reportName" type="text" class="form-control" [(ngModel)]="report.name" (input)="saveChanges()"
                minlength="1" maxlength="42" id="reportName" required>
            <div class="alert alert-danger p-1" *ngIf="!report.name">
                Report name required.
            </div>
        </div>
    </div>
</form>
