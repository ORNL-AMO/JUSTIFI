<form [formGroup]="form">
  <div class="row">
    <div class="col-12">
      <label>NAICS Code</label>
      <select class="form-select" formControlName="naics1" (change)="checkNAICS()" id="naics1"
        (focus)="focusField()">
        @for (naics of firstNaicsList; track naics) {
          <option [ngValue]="naics.code">{{naics.code}} -
          {{naics.industryType}}</option>
        }
      </select>
      @if (form.controls['naics1'].value) {
        <select class="form-select" formControlName="naics2" (change)="checkNAICS()"
          id="naics2" (focus)="focusField()">
          @for (naics of secondNaicsList | naicsList:form.controls['naics1'].value; track naics) {
            <option
              [ngValue]="naics.code">{{naics.code}} -
            {{naics.industryType}}</option>
          }
          <option [ngValue]=null></option>
        </select>
      }
      @if (form.controls['naics2'].value) {
        <select class="form-select" formControlName="naics3" (change)="saveChanges()"
          id="naics3" (focus)="focusField()">
          @for (naics of thirdNaicsList | naicsList:form.controls['naics2'].value; track naics) {
            <option
              [ngValue]="naics.code">{{naics.code}} -
            {{naics.industryType}}</option>
          }
          <option [ngValue]=null></option>
        </select>
      }
    </div>
    <div class="col-12">
      <label for="notes">Notes</label>
      <textarea id="notes" name="notes" class="form-control" formControlName="notes" (input)="saveChanges()"
      (focus)="focusField()"></textarea>
    </div>
  </div>
</form>
