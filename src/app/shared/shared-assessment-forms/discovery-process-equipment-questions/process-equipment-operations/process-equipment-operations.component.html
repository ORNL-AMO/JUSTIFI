<!--describeOutputRate-->
<label>
    Describe the output rate of the process and how it aligns with plant needs
</label>
<textarea id="describeOutputRate" name="describeOutputRate" class="form-control"
    [(ngModel)]="describeOutputRate" (input)="saveChanges()" (focus)="focusField('describeOutputRate')"
    rows="3"></textarea>
<hr class="my-1">


<!--describeOutputQualityMeasurement-->
<label>
    Describe the measurement of output quality and how it aligns with plant or company needs
</label>
<textarea id="describeOutputQualityMeasurement" name="describeOutputQualityMeasurement" class="form-control"
    [(ngModel)]="describeOutputQualityMeasurement" (input)="saveChanges()" (focus)="focusField('describeOutputQualityMeasurement')"
    rows="3"></textarea>
<hr class="my-1">
<!--describeMaintenanceNeeds-->
<label>
    Describe the maintenance and servicing needs of this process
</label>
<textarea id="describeMaintenanceNeeds" name="describeMaintenanceNeeds" class="form-control"
    [(ngModel)]="describeMaintenanceNeeds" (input)="saveChanges()" (focus)="focusField('describeMaintenanceNeeds')"
    rows="3"></textarea>
<hr class="my-1">

<!--describeLaborRequirements-->
<label>
    Describe the labor requirements of this process.
</label>
<textarea id="describeLaborRequirements" name="describeLaborRequirements" class="form-control"
    [(ngModel)]="describeLaborRequirements" (input)="saveChanges()" (focus)="focusField('describeLaborRequirements')"
    rows="3"></textarea>
<hr class="my-1">

<!--describeRequiredMaterials-->
<label>
    Describe the materials that are required by this process (raw materials, intermediate goods, treatment chemicals)?
</label>
<textarea id="describeRequiredMaterials" name="describeRequiredMaterials" class="form-control"
    [(ngModel)]="describeRequiredMaterials" (input)="saveChanges()" (focus)="focusField('describeRequiredMaterials')"
    rows="3"></textarea>
