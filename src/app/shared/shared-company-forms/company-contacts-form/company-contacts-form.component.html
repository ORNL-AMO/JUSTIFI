<div class="row">
    <div class="col-12">
        <form [formGroup]="contactForm">
            <div class="row mb-1">
                <label class="col-md-5 col-12 col-form-label" for="firstname">First Name <span
                        class="required-asterisk">*</span></label>
                <div class="col-md-7 col-12">
                    <input name="firstname" type="text" class="form-control" formControlName="firstname" id="firstname"
                        (input)="saveChanges()">
                    <div class="alert alert-danger form-error"
                        *ngIf="contactForm.controls['firstname'].touched && contactForm.controls['firstname'].getError('required')">
                        First Name Required
                    </div>
                </div>
                <label class="col-md-5 col-12 col-form-label" for="lastname">Last Name <span
                        class="required-asterisk">*</span></label>
                <div class="col-md-7 col-12">
                    <input name="lastname" type="text" class="form-control" formControlName="lastname" id="lastname"
                        (input)="saveChanges()">
                    <div class="alert alert-danger form-error"
                        *ngIf="contactForm.controls['lastname'].touched && contactForm.controls['lastname'].getError('required')">
                        Last Name Required
                    </div>
                </div>
            </div>
            <div class="row mb-1">
                <label class="col-md-5 col-12 col-form-label" for="phone">Phone Number</label>
                <div class="col-md-7 col-12 d-flex">
                    <input type="text" class="form-control" formControlName="phone" (input)="saveChanges()" id="phone"
                        name="phone">
                    <label class="mx-2 col-form-label" for="ext">ext.</label>
                    <input type="text" class="form-control" style="max-width: 100px;" formControlName="ext"
                        (input)="saveChanges()" id="ext" name="ext">
                </div>
                <div class="col-md-7 offset-md-5">
                    <div class="alert alert-warning form-error" *ngIf="contactForm.controls['phone'].errors && 
                                (contactForm.controls['phone'].touched || contactForm.controls['ext'].touched)">
                        Invalid phone number: for US xxx-xxx-xxxx / for international +xxx xxxxxxxxxx
                    </div>
                </div>
            </div>
            <div class="row mb-1">
                <label class="col-md-5 col-12 col-form-label" for="email">Email</label>
                <div class="col-md-7 col-12">
                    <input type="email" class="form-control" formControlName="email" (input)="saveChanges()" id="email"
                        name="email">
                    <div
                        *ngIf="contactForm.controls['email'].errors && (contactForm.controls['email'].touched || contactForm.controls['email'].dirty)">
                        <div class="alert alert-warning form-error"
                            *ngIf="contactForm.controls['email'].errors['email']">Invalid Email</div>
                        <div class="alert alert-warning form-error"
                            *ngIf="contactForm.controls['email'].errors['maxlength']">max length</div>
                    </div>
                </div>
            </div>
            <div class="row mb-1">
                <label class="col-md-5 col-12 col-form-label" for="role">Title</label>
                <div class="col-md-7 col-12">
                    <input type="text" class="form-control" formControlName="role" (input)="saveChanges()" id="role"
                        name="role">
                    <div class="alert alert-warning form-error" *ngIf="contactForm.controls['role'].errors">
                        Invalid title
                    </div>
                </div>
            </div>
            <div class="row mb-1">
                <label class="col-md-5 col-12 col-form-label" for="team">Team</label>
                <div class="col-md-7 col-12">
                    <input type="text" class="form-control" formControlName="team" (input)="saveChanges()" id="team"
                        name="team">
                    <div class="alert alert-warning form-error" *ngIf="contactForm.controls['team'].errors">
                        Invalid team
                    </div>
                </div>
            </div>
            <div class="row mb-1">
                <label class="col-md-5 col-12 col-form-label" for="notes">Notes</label>
                <div class="col-md-7 col-12">
                    <textarea class="form-control" name="notes" formControlName="notes"
                        (input)="saveChanges()"></textarea>
                    <div class="alert alert-warning form-error" *ngIf="contactForm.controls['notes'].errors">
                        Invalid notes
                    </div>
                </div>
            </div>
        </form>
    </div>
    <div class="col-12" *ngIf="!isModal">
        <hr>
    </div>
    <div class="col-12 text-end" *ngIf="!isModal">
        <button class="btn btn-sm btn-danger" (click)="openDeleteModal()">
            <fa-icon [icon]="faTrash"></fa-icon> Delete
        </button>
    </div>
</div>

<div [ngClass]="{'window-overlay': displayDeleteModal || routeGuardWarningModal}"></div>
<div class="popup" [ngClass]="{'open': displayDeleteModal }">
    <div class="popup-header">Delete Contact
        <button type="button" class="btn-close float-end" aria-label="Close" (click)="closeDeleteModal()"></button>
    </div>
    <div class="popup-body">
        <div class="alert alert-danger">
            Are you sure you want to delete this contact? Changes will be lost.
        </div>
        <hr>
    </div>
    <div class="popup-footer d-flex justify-content-end">
        <button class="btn btn-secondary btn-sm me-2" (click)="closeDeleteModal()">Cancel</button>
        <button class="btn btn-sm btn-danger" (click)="deleteContact()"><fa-icon [icon]="faTrash"></fa-icon> Delete
            Contact</button>
    </div>
</div>

<div class="popup" [ngClass]="{'open': routeGuardWarningModal }">
    <div class="popup-body">
        <div class="alert alert-danger">
            Please fill the required fields.
        </div>
    </div>
    <div class="popup-footer d-flex justify-content-end">
        <button class="btn btn-secondary me-2" (click)="closeWarningModal()">OK</button>
    </div>
</div>
