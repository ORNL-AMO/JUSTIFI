<p class="fw-light small" [innerHTML]="ProcessEquipmentSustainablityHelp.sectionHelp">
</p>
<hr class="my-2">
<!--describeRefrigerantProcessDustEmissions-->
<label>
    Describe any refrigerant, process, or dust emissions that may come from this system
</label>
<ng-container *ngIf="inPortfolio">
    <p class="fw-light small" [innerHTML]="ProcessEquipmentSustainablityHelp.describeRefrigerantProcessDustEmissions">
    </p>
    <p class="fw-light small" [innerHTML]="ProcessEquipmentSustainablityHelp.describeRefrigerantProcessDustEmissionsQs">
    </p>
</ng-container>
<textarea id="describeRefrigerantProcessDustEmissions" name="describeRefrigerantProcessDustEmissions"
    class="form-control" [(ngModel)]="describeRefrigerantProcessDustEmissions" (input)="saveChanges()"
    (focus)="focusField('describeRefrigerantProcessDustEmissions')" rows="3"></textarea>
<hr class="my-1">

<!--describeWasteStreams-->

<hr class="my-1">
