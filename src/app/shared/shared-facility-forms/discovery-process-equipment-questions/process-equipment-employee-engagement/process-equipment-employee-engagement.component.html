<p class="fw-light small" [innerHTML]="ProcessEquipmentEmployeeEngagementHelp.sectionHelp">
</p>
<!--describeSafetyConcerns-->
<label>
  Describe any safety concerns related to this system
</label>
@if (inPortfolio) {
  <p class="fw-light small" [innerHTML]="ProcessEquipmentEmployeeEngagementHelp.describeSafetyConcerns">
  </p>
  <p class="fw-light small" [innerHTML]="ProcessEquipmentEmployeeEngagementHelp.describeSafetyConcernsQs">
  </p>
}
<textarea id="describeSafetyConcerns" name="describeSafetyConcerns" class="form-control"
  [(ngModel)]="describeSafetyConcerns" (input)="saveChanges()" (focus)="focusField('describeSafetyConcerns')"
rows="3"></textarea>
<hr class="my-1">

<!--describeWorkplaceEnvironment-->
<label>
  Describe any other workplace environment details related to the system
</label>
@if (inPortfolio) {
  <p class="fw-light small" [innerHTML]="ProcessEquipmentEmployeeEngagementHelp.describeWorkplaceEnvironment">
  </p>
  <p class="fw-light small" [innerHTML]="ProcessEquipmentEmployeeEngagementHelp.describeWorkplaceEnvironmentQs">
  </p>
}
<textarea id="describeWorkplaceEnvironment" name="describeWorkplaceEnvironment" class="form-control"
  [(ngModel)]="describeWorkplaceEnvironment" (input)="saveChanges()"
(focus)="focusField('describeWorkplaceEnvironment')" rows="3"></textarea>
