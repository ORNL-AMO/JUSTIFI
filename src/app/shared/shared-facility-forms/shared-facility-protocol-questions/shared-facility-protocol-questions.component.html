<div class="row">
    <div class="col">
        <!--ghg emissions-->
        <label class="bold">
            Does the facility track their Greenhouse Gas Emissions (GHGs) related to energy intensity?
        </label>
        <p class="fw-light small" *ngIf="inPortfolio" [innerHTML]="FacilityProtocolHelp.doesFacilityTrackGHG">
        </p>
        <textarea id="doesFacilityTrackGHG" name="doesFacilityTrackGHG" class="form-control"
            [(ngModel)]="doesFacilityTrackGHG" (input)="saveChanges()" (focus)="focusField('doesFacilityTrackGHG')"
            rows="3"></textarea>
        <hr>
        <!--equipment acquisition-->
        <label class="bold">
            What does the facility use to judge equipment acquisition (lifecycle, performance, costs, etc.)?
        </label>
        <p class="fw-light small" *ngIf="inPortfolio" [innerHTML]="FacilityProtocolHelp.equipmentAcquisition">
        </p>
        <textarea id="equipmentAcquisition" name="equipmentAcquisition" class="form-control"
            [(ngModel)]="equipmentAcquisition" (input)="saveChanges()" (focus)="focusField('equipmentAcquisition')"
            rows="3"></textarea>

        <hr>
        <!--how costs are tracked-->
        <label class="bold">
            How does the facility track its costs?
        </label>
        <p class="fw-light small" *ngIf="inPortfolio" [innerHTML]="FacilityProtocolHelp.howCostsTracked">
        </p>
        <textarea id="howCostsTracked" name="howCostsTracked" class="form-control" [(ngModel)]="howCostsTracked"
            (input)="saveChanges()" (focus)="focusField('howCostsTracked')" rows="3"></textarea>
        <hr>
        <!--financial criteria-->
        <label class="bold">
            What financial criteria does the facility use to evaluate projects?
        </label>
        <p class="fw-light small" *ngIf="inPortfolio" [innerHTML]="FacilityProtocolHelp.financialCriteria">
        </p>
        <textarea id="financialCriteria" name="financialCriteria" class="form-control" [(ngModel)]="financialCriteria"
            (input)="saveChanges()" (focus)="focusField('financialCriteria')" rows="3"></textarea>

        <hr>
        <!--external financial pressures-->
        <label class="bold">
            Are there any external financial pressures?
        </label>
        <p class="fw-light small" *ngIf="inPortfolio" [innerHTML]="FacilityProtocolHelp.outsidePressures">
        </p>
        <textarea id="outsidePressures" name="outsidePressures" class="form-control" [(ngModel)]="outsidePressures"
            (input)="saveChanges()" (focus)="focusField('outsidePressures')" rows="3"></textarea>
        <hr>

        <!--financial metrics used-->
        <label class="bold">
            What financial metrics are used to evaluate plant operations?
        </label>
        <p class="fw-light small" *ngIf="inPortfolio" [innerHTML]="FacilityProtocolHelp.financialMetricsUsed">
        </p>
        <textarea id="financialMetricsUsed" name="financialMetricsUsed" class="form-control"
            [(ngModel)]="financialMetricsUsed" (input)="saveChanges()" (focus)="focusField('financialMetricsUsed')"
            rows="3"></textarea>
        <hr>

        <!--financial metrics used-->
        <label class="bold">
            What costs are associated with operations (beyond energy)?
        </label>
        <p class="fw-light small" *ngIf="inPortfolio" [innerHTML]="FacilityProtocolHelp.associatedCosts">
        </p>
        <textarea id="associatedCosts" name="associatedCosts" class="form-control" [(ngModel)]="associatedCosts"
            (input)="saveChanges()" (focus)="focusField('associatedCosts')" rows="3"></textarea>
        <hr>

        <!--efficiency incentives-->
        <label class="bold">
            What energy efficiency incentives is your facility eligible for?
        </label>
        <p class="fw-light small" *ngIf="inPortfolio" [innerHTML]="FacilityProtocolHelp.efficiencyIncentives">
        </p>
        <textarea id="efficiencyIncentives" name="efficiencyIncentives" class="form-control"
            [(ngModel)]="efficiencyIncentives" (input)="saveChanges()" (focus)="focusField('efficiencyIncentives')"
            rows="3"></textarea>
        <hr>

        <!--dependentFunding-->
        <label class="bold">
            Does the facility depend on internal or external funding for energy projects?
        </label>
        <p class="fw-light small" *ngIf="inPortfolio" [innerHTML]="FacilityProtocolHelp.dependentFunding">
        </p>
        <textarea id="dependentFunding" name="dependentFunding" class="form-control" [(ngModel)]="dependentFunding"
            (input)="saveChanges()" (focus)="focusField('dependentFunding')" rows="3"></textarea>
    </div>
</div>
