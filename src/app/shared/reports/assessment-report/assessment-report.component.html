<div class="report" [ngClass]="{'print': print}">
  <app-report-details-table [assessment]="assessment"></app-report-details-table>
  @if (assessmentReport) {
    @if (!inRollup) {
      <hr>
      }
      <div class="print-break-avoid">
        <app-assessment-savings-chart [assessmentReport]="assessmentReport"></app-assessment-savings-chart>
      </div>
      @if (assessmentReport.keyPerformanceIndicatorReport.kpiReportItems.length > 0) {
        <div class="print-break-avoid">
          <app-performance-metrics-table
          [keyPerformanceIndicatorReport]="assessmentReport.keyPerformanceIndicatorReport"></app-performance-metrics-table>
        </div>
        <div class="print-break-avoid">
          <app-additional-savings-message [assessmentReport]="assessmentReport" [context]="'assessment'"
          [includesKpiTable]="true"></app-additional-savings-message>
        </div>
        <div class="print-break-avoid">
          <app-performance-metrics-chart
          [keyPerformanceIndicatorReport]="assessmentReport.keyPerformanceIndicatorReport"></app-performance-metrics-chart>
        </div>
        <div class="print-break-avoid">
          <app-performance-metrics-impacts-table
            [keyPerformanceIndicatorReport]="assessmentReport.keyPerformanceIndicatorReport">
          </app-performance-metrics-impacts-table>
        </div>
        <hr>
        } @else {
          <div class="print-break-avoid">
            <app-additional-savings-message [assessmentReport]="assessmentReport" [context]="'assessment'"
            [includesKpiTable]="false"></app-additional-savings-message>
          </div>
        }
        <div class="print-break-avoid print-break-before">
          <app-payback-table [assessmentReport]="assessmentReport"></app-payback-table>
        </div>
        <div class="print-break-avoid">
          <app-payback-waterfall-chart [reportData]="assessmentReport"></app-payback-waterfall-chart>
        </div>
        <hr>
          <div class="print-break-avoid">
            <app-neb-contributions-bar-chart [assessmentReport]="assessmentReport"
            [totalNebFinancialImpact]="assessmentReport.totalNebFinancialImpact"></app-neb-contributions-bar-chart>
          </div>
          <div class="print-break-avoid">
            <app-assessment-cost-table [assessmentReport]="assessmentReport"></app-assessment-cost-table>
          </div>
          <div class="print-break-avoid">
            <app-assessment-savings-table [assessmentReport]="assessmentReport"></app-assessment-savings-table>
          </div>
        }
      </div>
