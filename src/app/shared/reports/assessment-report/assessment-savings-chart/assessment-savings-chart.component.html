<div class="row">
    <div class="col-12">
        <div #totalSavingsChart></div>
    </div>
    <div class="col-12">
        <app-assessment-item-savings-bar-chart [totalNonNebCostSavings]="assessmentReport.totalNonNebCostSavings"
            [itemName]="assessmentReport.assessment.name"
            [nebReports]="assessmentReport.assessmentNebReports"></app-assessment-item-savings-bar-chart>
    </div>
    <ng-container *ngFor="let energyOppReport of assessmentReport.energyOpportunityReports">
        <div class="col-12" *ngIf="energyOppReport.totalCostSavings != 0">
            <app-assessment-item-savings-bar-chart [totalNonNebCostSavings]="energyOppReport.totalNonNebCostSavings"
                [itemName]="energyOppReport.energyOpportunity.name"
                [nebReports]="energyOppReport.nebReports"></app-assessment-item-savings-bar-chart>
        </div>
    </ng-container>
</div>
