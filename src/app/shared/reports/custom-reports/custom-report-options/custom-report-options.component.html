<form>
    <div class="row">
        <label class="col-sm-5 col-form-label" for="reportName">Report Name <span
                class="required-asterisk">*</span></label>
        <div class="col-sm-7">
            <input name="reportName" type="text" class="form-control" [(ngModel)]="report.name" (input)="saveChanges()"
                minlength="1" maxlength="42" id="reportName" required>
            <div class="alert alert-danger p-1" *ngIf="!report.name">
                Report name required.
            </div>
        </div>
    </div>
    <div class="row">
        <label class="col-sm-5 col-form-label" for="reportType">Report Type</label>
        <div class="col-sm-7">
            <select class="form-select" name="reportType" [(ngModel)]="report.reportType" (change)="saveChanges()">
                <option *ngFor="let reportType of reportTypeOptions" [value]="reportType.reportType">
                    {{reportType.label}}
                </option>
            </select>
        </div>
    </div>
    <div class="row">
        <div class="col-12">
            <hr class="my-1">
        </div>
        <div class="col-12">
            <p class="mb-0">
                Select content to include in report.
            </p>
            <ng-container *ngFor="let assessmentOption of report.assessmentOptions">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" [id]="'assessment_'+assessmentOption.assessmentId"
                        [(ngModel)]="assessmentOption.include" (change)="saveChanges()"
                        [name]="'assessment_'+assessmentOption.assessmentId">
                    <label class="form-check-label" [for]="'assessment_'+assessmentOption.assessmentId">
                        <fa-icon [icon]="faScrewdriverWrench"></fa-icon>
                        {{assessmentOption.assessmentId | assessmentNameDisplay:assessments}}
                    </label>
                </div>
                <div class="form-section" *ngIf="assessmentOption.include">
                    <ng-container
                        *ngFor="let energyOpportunityOption of (report.energyOpportunityOptions | energyOpportunityReportOptionsList: assessmentOption.assessmentId)">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox"
                                [id]="'energyOpp_'+energyOpportunityOption.energyOpportunityId"
                                [(ngModel)]="energyOpportunityOption.include" (change)="saveChanges()"
                                [name]="'energyOpp_'+energyOpportunityOption.energyOpportunityId">
                            <label class="form-check-label" [for]="'energyOpp_'+energyOpportunityOption.energyOpportunityId">
                                <fa-icon [icon]="faFileLines"></fa-icon>
                                {{energyOpportunityOption.energyOpportunityId | energyOpportunityDisplay:energyOpportunities}}
                            </label>
                        </div>
                        <div class="form-section" *ngIf="energyOpportunityOption.include">
                            <ng-container
                                *ngFor="let nonEnergyBenefit of (report.nonEnergyBenefitOptions | nonEnergyBenefitReportOptionsList: energyOpportunityOption.energyOpportunityId: 'energyOpp')">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox"
                                        [id]="'nebOpp_'+nonEnergyBenefit.nonEnergyBenefitId" [(ngModel)]="nonEnergyBenefit.include"
                                        (change)="saveChanges()" [name]="'nebOpp_'+nonEnergyBenefit.nonEnergyBenefitId">
                                    <label class="form-check-label" [for]="'nebOpp_'+nonEnergyBenefit.nonEnergyBenefitId">
                                        <fa-icon [icon]="faWeightHanging"></fa-icon>
                                        {{(nonEnergyBenefit.nonEnergyBenefitId | nebItem:nonEnergyBenefits).name}}
                                    </label>
                                </div>
                            </ng-container>
                        </div>
                    </ng-container>
                    <ng-container
                        *ngFor="let nonEnergyBenefit of (report.nonEnergyBenefitOptions | nonEnergyBenefitReportOptionsList: assessmentOption.assessmentId: 'assessment')">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" [id]="'nebOpp_'+nonEnergyBenefit.nonEnergyBenefitId"
                                [(ngModel)]="nonEnergyBenefit.include" (change)="saveChanges()"
                                [name]="'nebOpp_'+nonEnergyBenefit.nonEnergyBenefitId">
                            <label class="form-check-label" [for]="'nebOpp_'+nonEnergyBenefit.nonEnergyBenefitId">
                                <fa-icon [icon]="faWeightHanging"></fa-icon>
                                {{(nonEnergyBenefit.nonEnergyBenefitId | nebItem:nonEnergyBenefits).name}}
                            </label>
                        </div>
                    </ng-container>
                </div>
            </ng-container>
        </div>
    </div>
</form>
