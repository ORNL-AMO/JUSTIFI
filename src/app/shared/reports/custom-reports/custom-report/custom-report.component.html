<button class="btn btn-outline-secondary float-right btn-sm" *ngIf="inPortfolio && !print">
    <fa-icon [icon]="faPrint" (click)="togglePrint()"></fa-icon>
</button>

<ng-container *ngIf="report.reportType == 'assessment'">
    <ng-container *ngIf="report.assessmentReportOptions.includeRollupReport">
        <div class="print-break-before">
            <h4>
                <fa-icon [icon]="faChartColumn"></fa-icon>
                Rollup Report
            </h4>
            <app-on-site-visit-report [onSiteVisit]="onSiteVisit" [report]="report"></app-on-site-visit-report>
            <hr>
        </div>
    </ng-container>
    <ng-container *ngIf="report.assessmentReportOptions.includeIndividualAssessments">
        <ng-container *ngFor="let assessmentOption of report.assessmentOptions">
            <ng-container *ngIf="assessmentOption.include">
                <div class="report">
                    <div class="print-break-before">
                        @let assessment = (assessmentOption.assessmentId | assessmentItem: assessments);
                        <h4>
                            <fa-icon [icon]="faPieChart"></fa-icon>
                            {{assessment.name}} Report
                        </h4>
                        <app-assessment-report [assessment]="assessment" [report]="report"></app-assessment-report>
                        <hr>
                    </div>
                </div>
            </ng-container>
        </ng-container>
    </ng-container>
</ng-container>

<ng-container *ngIf="report.reportType == 'executiveSummary'">
    <div class="print-break-before">
        <h4>
            <fa-icon [icon]="faSackDollar"></fa-icon>
            Executive Summary Report
        </h4>
    </div>
    <app-executive-summary-report [report]="report" [onSiteVisit]="onSiteVisit"></app-executive-summary-report>
</ng-container>
