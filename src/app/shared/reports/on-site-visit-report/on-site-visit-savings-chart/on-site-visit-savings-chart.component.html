<div class="row">
    <div class="col-12">
        <div #onSiteVisitSavingsChart id="onSiteVisitSavingsChart"></div>
    </div>
</div>
<ng-container *ngIf="onSiteVisitReport.assessmentReports.length > 1">
    <div class="row" *ngFor="let assessmentReport of onSiteVisitReport.assessmentReports">
        <div class="col-12">
            <app-assessment-savings-chart [xMax]="xMax" [assessmentReport]="assessmentReport"
                [inRollup]="true"></app-assessment-savings-chart>
        </div>
    </div>
</ng-container>
