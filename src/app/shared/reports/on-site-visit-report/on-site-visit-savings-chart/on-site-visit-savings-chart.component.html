<div class="row">
  <div class="col-12">
    <div #onSiteVisitSavingsChart id="onSiteVisitSavingsChart"></div>
  </div>
</div>
@if (onSiteVisitReport.assessmentReports.length > 1) {
  @for (assessmentReport of onSiteVisitReport.assessmentReports; track assessmentReport) {
    <div class="row">
      <div class="col-12">
        <app-assessment-savings-chart [xMax]="xMax" [assessmentReport]="assessmentReport"
        [inRollup]="true"></app-assessment-savings-chart>
      </div>
    </div>
  }
}
