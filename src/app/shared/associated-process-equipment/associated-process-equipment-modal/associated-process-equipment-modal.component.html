<div [ngClass]="{'window-overlay': displayModal}"></div>
<div class="popup" [ngClass]="{'open': displayModal }">
    <div class="popup-header">
        <fa-icon [icon]="faLink"></fa-icon>
        Select Linked End Uses
        <button type="button" class="btn-close float-end" aria-label="Close" (click)="closeModal()"></button>
    </div>
    <div class="popup-body">
        <ng-template [ngIf]="!selectedEquipment" [ngIfElse]="equipmentCard">
            <ng-template [ngIf]="processEquipments.length != 0" [ngIfElse]="noEquipmentBlock">
                <div class="list-group">
                    <div class="list-group-item list-group-item-action"
                        *ngFor="let equipment of processEquipments; let index = index;" (click)="toggleActive(index)">
                        <div class="d-flex justify-content-between w-100">
                            <div class="p-0">
                                <ng-template [ngIf]="(contextGuid | includesProcessEquipment:itemContext: equipment)"
                                    [ngIfElse]="notSelectedBlock">
                                    <fa-icon class="success" [icon]="faCircleCheck"></fa-icon>
                                </ng-template>
                                <ng-template #notSelectedBlock>
                                    <fa-icon [icon]="faCircle"></fa-icon>
                                </ng-template>
                                {{equipment.equipmentName}}
                            </div>
                            <button class="btn btn-sm btn-primary btn-sm" (click)="viewEquipment(equipment)">
                                View
                            </button>
                        </div>
                    </div>
                </div>
            </ng-template>
            <ng-template #noEquipmentBlock>
                <div class="alert alert-warning">
                    No End Uses Found.
                </div>
            </ng-template>
        </ng-template>
        <ng-template #equipmentCard>
            <a class="click-link" (click)="viewEquipment(undefined)">
                <fa-icon [icon]="faChevronLeft"></fa-icon> View All End Uses
            </a>
            <table class="table table-bordered table-sm">
                <thead>
                    <tr>
                        <th>
                            <ng-template
                                [ngIf]="(contextGuid | includesProcessEquipment:itemContext: selectedEquipment)">
                                <fa-icon class="success" [icon]="faCircleCheck"></fa-icon>
                            </ng-template>
                            {{selectedEquipment.equipmentName}}
                        </th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>
                            {{selectedEquipment.notes}}
                        </td>
                    </tr>
                </tbody>
            </table>
        </ng-template>
        <hr class="my-1">
    </div>
    <div class="popup-footer d-flex justify-content-end">
        <button class="btn btn-secondary me-2 btn-sm" (click)="closeModal()">Cancel</button>
        <button class="btn btn-outline-end-use" (click)="saveChanges()"><fa-icon [icon]="faSave"></fa-icon> Set
            Linked End Uses</button>
    </div>
</div>
