name: Web

on:
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: true
          lfs: false
      - name: Get Node version
        run: echo "BUILD_NODE_VER=$(grep -o -P -m 1 '(?<=node":\s").*(?=")' package.json)" >> $GITHUB_ENV
      - name: Node setup
        uses: actions/setup-node@v3
        with:
          node-version: ${{ env.BUILD_NODE_VER }}
      - name: Attach SHA to build
        if: github.ref_name == 'develop' || github.ref_name == 'ci/pipeline-integration'
        run: |
          BUILD_VERSION=$(grep -o -P -m 1 '(?<=version":\s").*(?=")' package.json)
          sed -i "s/$BUILD_VERSION/$BUILD_VERSION-${GITHUB_SHA::7}/g" package.json
      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: npm-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-
      - name: Install dependencies
        run: npm install
      - name: Build [DEV]
        if: github.ref_name == 'develop' || github.ref_name == 'ci/pipeline-integration'
        run: npm run build
      - name: Build [PROD]
        if: github.ref_name == 'master'
        run: npm run build-prod
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: ./dist/neb-tool/browser
          if-no-files-found: error
          retention-days: 3
  
  deploy-dev:
    if: github.ref_name == 'develop' || github.ref_name == 'ci/pipeline-integration'
    runs-on: [self-hosted, prod]
    needs: build
    env:
      APACHE_DIR: /var/www/html
      BACKUP_DIR: /opt/actions-runner/backups
    steps:
      - name: Get artifact
        uses: actions/download-artifact@v4
        with:
           name: dist
      - name: Deploy
        run: |
          tar -czf $BACKUP_DIR/justifi-dev_$(printf '%(%Y-%m-%d)T\n' -1)_${GITHUB_SHA::7}.tar.gz $APACHE_DIR/justifi-dev &&
          rm -rf $APACHE_DIR/justifi-dev/* && 
          mv -v ./* $APACHE_DIR/justifi-dev/

  deploy-prod:
    if: github.ref_name == 'master'
    runs-on: [self-hosted, prod]
    needs: build
    env:
      APACHE_DIR: /var/www/html
      BACKUP_DIR: /opt/actions-runner/backups
    steps:
      - name: Get artifact
        uses: actions/download-artifact@v4
        with:
           name: dist
      - name: Deploy
        run: |
          tar -czf $BACKUP_DIR/justifi_$(printf '%(%Y-%m-%d)T\n' -1)_${GITHUB_SHA::7}.tar.gz $APACHE_DIR/justifi
          rm -rf $APACHE_DIR/justifi/*
          mv -v ./* $APACHE_DIR/justifi/