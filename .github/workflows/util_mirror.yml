name: "Util: Mirror"

on:
  workflow_dispatch:
  # schedule:
  #   - cron: "0 6,13 * * *"

permissions:
  contents: write

jobs:
  sync-mirror:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout mirror
        uses: actions/checkout@v4
        with:
          ref: mirror
      - name: Setup git
        run: |
          git config --global user.name "Sync Mirror"
          git config --global user.email "<>"
      - name: Set upstream
        run: git remote add -t ${{ secrets.REMOTE_UPSTREAM_BRANCH }} upstream ${{ secrets.REMOTE_UPSTREAM }}
      - name: Sync local mirror
        run: |
          git fetch --all
          git reset --hard upstream/${{ secrets.REMOTE_UPSTREAM_BRANCH }}
          git rm -rf .github/workflows
          git checkout origin/mirror -- .github/workflows || true
          if ! git diff --quiet origin/mirror; then
            git commit -am "Sync mirror from upstream"
          fi
      - name: Push to origin
        run: git push -f origin mirror
      - name: Diff
        run: git diff origin/develop
