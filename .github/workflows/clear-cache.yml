name: Clear NPM Cache

on:
  workflow_dispatch:

jobs:
  clear-cache:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Delete all caches using GitHub API
        run: |
          CACHES=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/caches" \
            | jq -r '.actions_caches[] | .id')
          
          for CACHE_ID in $CACHES; do
            echo "Deleting cache ID: $CACHE_ID"
            curl -s -X DELETE \
              -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github.v3+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/caches/$CACHE_ID"
          done
          
          echo "All caches deleted successfully"
