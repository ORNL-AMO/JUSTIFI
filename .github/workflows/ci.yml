name: CI

on:
  pull_request:
    branches:
      - 'develop'
      - 'master'

jobs:
  test:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        NODE_VERSION: [20.x]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Setup node ${{ matrix.NODE_VERSION }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.NODE_VERSION }}
          cache: 'npm'
      - name: Install dependencies
        run: npm install
      - name: Build
        run: npm run build --if-present
      - name: Test
        run: npm run test-ci